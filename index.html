<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>留白 — Liubai</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #cfc6b8;
      font-family: "Songti SC", "Noto Serif CJK SC", "Noto Serif SC",
                   Palatino, "Palatino Linotype", "Times New Roman", serif;
      color: #ebe4d8;
      cursor: default;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    #title {
      position: absolute;
      top: 7%;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 400;
      font-size: clamp(18px, 2.2vw, 28px);
      letter-spacing: 0.55em;
      margin-left: 0.55em;
      opacity: 0;
      transition: opacity 2.8s ease;
      text-shadow: 0 1px 12px rgba(40, 30, 20, 0.35);
    }
    #title.show { opacity: 0.72; }
    #title.gone { opacity: 0; }
    #hint {
      position: absolute;
      bottom: 7%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: 0.16em;
      opacity: 0.62;
      white-space: nowrap;
      text-shadow: 0 1px 10px rgba(30, 24, 16, 0.45);
      transition: opacity 2.6s ease;
    }
    #hint.gone { opacity: 0; }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #cfc6b8;
      color: #5a5348;
      letter-spacing: 0.45em;
      font-size: 18px;
      transition: opacity 1.1s ease;
      pointer-events: auto;
    }
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="loading">留白</div>
    <div id="title">留白</div>
    <div id="hint">Click to look &nbsp;·&nbsp; WASD to walk</div>
  </div>
  <script type="module" src="./js/main.js"></script>
</body>
</html>
