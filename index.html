<!DOCTYPE html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>留白 — Liubai</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #cfc6b8;
      font-family: "Songti SC", "Noto Serif CJK SC", "Noto Serif SC",
                   Palatino, "Palatino Linotype", "Times New Roman", serif;
      color: #ebe4d8;
      cursor: default;
    }
    canvas { display: block; width: 100%; height: 100%; }
    #overlay {
      position: fixed;
      inset: 0;
      pointer-events: none;
      z-index: 2;
    }
    #title {
      position: absolute;
      top: 7%;
      left: 50%;
      transform: translateX(-50%);
      font-weight: 400;
      font-size: clamp(18px, 2.2vw, 28px);
      letter-spacing: 0.55em;
      margin-left: 0.55em;
      opacity: 0;
      transition: opacity 2.8s ease;
      text-shadow: 0 1px 12px rgba(40, 30, 20, 0.35);
    }
    #title.show { opacity: 0.72; }
    #title.gone { opacity: 0; }
    #hint {
      position: absolute;
      bottom: 7%;
      left: 50%;
      transform: translateX(-50%);
      font-size: 13px;
      letter-spacing: 0.16em;
      opacity: 0.62;
      white-space: nowrap;
      text-shadow: 0 1px 10px rgba(30, 24, 16, 0.45);
      transition: opacity 2.6s ease;
    }
    #hint.gone { opacity: 0; }
    #loading {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      background: #cfc6b8;
      color: #5a5348;
      letter-spacing: 0.45em;
      font-size: 18px;
      transition: opacity 1.1s ease;
      pointer-events: auto;
    }
    #status {
      letter-spacing: 0.12em;
      font-size: 12px;
      color: #7a7368;
      min-height: 1em;
    }

    #nav {
      position: absolute;
      top: 7%;
      right: 6%;
      pointer-events: auto;
      font-size: 13px;
      letter-spacing: 0.16em;
      opacity: 0;
      transition: opacity 2.6s ease;
      text-shadow: 0 1px 10px rgba(30, 24, 16, 0.45);
      z-index: 3;
    }
    #nav.show { opacity: 0.72; }
    #nav a {
      color: inherit;
      text-decoration: none;
      margin-left: 1.3em;
    }
    #nav a:first-child { margin-left: 0; }

    #loading-links {
      letter-spacing: 0.16em;
      font-size: 12px;
      color: #7a7368;
    }
    #loading-links a {
      color: inherit;
      text-decoration: none;
      border-bottom: 1px solid rgba(90, 83, 72, 0.35);
    }
    #loading.hide {
      opacity: 0;
      pointer-events: none;
    }
  </style>
</head>
<body>
  <div id="overlay">
    <div id="loading">留白<div id="status">loading…</div><div id="loading-links"><a href="./residents.html">Residents</a> &nbsp;·&nbsp; <a href="./join.html">Arrive</a></div></div>
    <div id="title">留白</div>
    <div id="hint">Click to look &nbsp;·&nbsp; WASD to walk</div>
    <nav id="nav"><a href="./residents.html">Residents</a><a href="./join.html">Arrive</a></nav>
  </div>
  <script type="module" src="./js/main.js?v=2"></script>
  <script>
    setTimeout(function () {
      if (window.__LIUBAI_STARTED) return;
      var status = document.getElementById('status');
      var loading = document.getElementById('loading');
      if (!loading || loading.classList.contains('hide')) return;
      if (status) status.textContent = 'The 3D script did not start. Try refreshing, or another browser.';
    }, 8000);
    (function () {
      var loading = document.getElementById('loading');
      var nav = document.getElementById('nav');
      if (!loading || !nav) return;
      var reveal = function () {
        if (loading.classList.contains('hide')) nav.classList.add('show');
      };
      reveal();
      new MutationObserver(reveal).observe(loading, { attributes: true, attributeFilter: ['class'] });
    })();
  </script>
</body>
</html>
